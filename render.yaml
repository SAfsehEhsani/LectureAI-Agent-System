services:
  - type: web
    name: lecturelens-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set manually in Render dashboard
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: WHISPER_MODEL
        value: base
      - key: MAX_CLIPS
        value: "3"
      - key: CORS_ORIGINS
        sync: false          # set to your frontend URL e.g. https://lecturelens-ui.onrender.com

  - type: web
    name: lecturelens-ui
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # set to your backend URL e.g. https://lecturelens-api.onrender.com
